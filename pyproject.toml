[project]
name = "tensorflow-memory-ai-course"
version = "0.1.0"
description = "Executable microlearning course and Memory AI Lab"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "nbclient",
  "nbformat",
  "ipykernel",
  "markdown",
  "mkdocs",
  "mkdocs-material",
  "pyyaml",
]

[project.optional-dependencies]
ml = [
  "tensorflow",
  "keras",
  "keras-hub",
  "networkx",
]

lesson-agent = [
  "google-adk>=2.6",
]

gui = [
  "google-adk>=2.6",
  "streamlit>=1.40",
  # The GUI renders notebooks read-only and hands execution to Jupyter Lab
  # ("Apri in Jupyter"). Not previously declared anywhere, even though the
  # README already told learners to run `uv run jupyter lab notebooks/`.
  "jupyterlab>=4.0",
]

dev = [
  "pytest",
  "ruff",
  "mypy",
  "pandas-stubs",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_ai", "src/lesson_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
