# Work queue for the remediation loop.
#
# This file is the ONLY durable state shared between loop iterations. Each
# iteration starts cold: it reads this file, picks one item, does it, updates
# the item, commits. Nothing else carries over.
#
# Specification for every item: reports/SDD-remediation-2026-08-06.md
# Operating procedure for the loop: reports/handover/AGENT_LOOP.md
# Pick the next item with: uv run python scripts/next_work_item.py
#
# status values:
#   todo         ready to be picked (all dependencies satisfied)
#   in_progress  claimed by an iteration; see recovery rules in AGENT_LOOP.md
#   done         implemented, verified and committed
#   blocked      waiting on a human decision named in blocked_by
#
# Do not hand-edit `status` to `done` without having run the item's `verify`
# command successfully.
#
# verify_fast  gate cheap da eseguire per prima, dentro l'iterazione
# verify       la vera definizione di done: finche' non passa, l'item non e' done
# verify_env   cosa deve fornire la macchina. Se non riesci a costruirlo, e' un
#              limite dell'ambiente: committa con nota, lascia todo, non revertire
#
# Un run parziale (`execute_notebooks.py --only ...`) sporca datasets/processed/
# di proposito: piu' lezioni scrivono lo stesso file in sequenza. Ripulisci con
# `git checkout -- datasets/`. L'invariante di git status pulito vale solo dopo
# un run completo.

meta:
  sdd: reports/SDD-remediation-2026-08-06.md
  procedure: reports/handover/AGENT_LOOP.md
  # The loop works on whatever branch the iteration was assigned. This field
  # records where the machinery currently lives, not a branch to push to:
  # hard-coding a branch here is what desynchronised the first attempt, which
  # ran on `agent/complete-sdd-remediation` while this said something else.
  machinery_landed_on: claude/sdd-implementation-review-b73ltl
  # Never push to master. Never resolve a decision.
  last_verified: 2026-08-07  # every status below re-checked against the tree
  # Decisions belong to the course author. An agent must never resolve one.
  decisions:
    D1:
      question: "Modulo mlops: costruirlo, ridurlo a percorso locale, o rimuoverlo?"
      recommendation: "B — ridurlo a 2-3 lezioni eseguibili in locale"
      status: open
    D2:
      question: "Esercizi per le lezioni 31-60: tutte, nessuna, o ibrido?"
      recommendation: "C tendendo ad A — esercizi dove non serve Gemma"
      status: open
    D3:
      question: "Research pack incompleti: completarli tutti o emendare la spec?"
      recommendation: "B — emendare la spec, evidence.yaml obbligatorio"
      status: open

