      - notebooks/lezione-56-capstone-gemma-lora.ipynb
      - README.md
    verify_fast:
      - "uv run python -c \"import nbformat,sys; [nbformat.validate(nbformat.read(f,as_version=4)) for f in sys.argv[1:]]; print('valid')\" notebooks/lezione-34-keras-hub.ipynb notebooks/lezione-35-inferenza-gemma.ipynb notebooks/lezione-36-output-strutturato.ipynb notebooks/lezione-41-gemma-lora.ipynb notebooks/lezione-56-capstone-gemma-lora.ipynb"
      - "TF_CPP_MIN_LOG_LEVEL=3 uv run python scripts/execute_notebooks.py --only lezione-34-keras-hub lezione-35-inferenza-gemma lezione-36-output-strutturato lezione-41-gemma-lora lezione-56-capstone-gemma-lora"
    verify:
