claims:
  - id: block-sublayers
    claim: "A Transformer encoder block wraps the self-attention sub-layer and a position-wise feed-forward sub-layer, each followed by a residual connection and layer normalization; the position-wise FFN is two linear transformations with a non-linearity in between, applied identically at every position."
    importance: critical
    source_url: "https://arxiv.org/abs/1706.03762"
    source_title: "Attention Is All You Need"
    publisher: "Vaswani et al., NeurIPS 2017 (arXiv:1706.03762)"
    accessed_at: "2026-07-18"
    primary_source: true
    evidence_note: "Section 3.1 describes the residual connection + layer normalization around each of the two sub-layers; Section 3.3 defines the position-wise feed-forward network as two linear layers with a ReLU in between."
    status: needs_reverification
  - id: residual-same-shape
    claim: "The residual connection adds the sub-layer input to its output (x + Sublayer(x)), which requires the sub-layer to preserve the model dimension, so a block's input and output both have shape (n, d_model) and blocks can be stacked."
    importance: major
    source_url: "https://arxiv.org/abs/1706.03762"
    source_title: "Attention Is All You Need"
    publisher: "Vaswani et al., NeurIPS 2017 (arXiv:1706.03762)"
    accessed_at: "2026-07-18"
    primary_source: true
    evidence_note: "Section 3.1 states all sub-layers and embeddings produce outputs of dimension d_model to enable the residual connections."
    status: needs_reverification
  - id: output-projection-dmodel
    claim: "The attention sub-layer returns to d_model through a learned output projection W_O, and the second linear transformation of the FFN returns to the same dimension. This is what makes the residual sum x + Sublayer(x) well defined and lets blocks be stacked, even though the intermediate work happens in other dimensions (d_v per head, d_ff inside the FFN)."
    importance: major
    source_url: "https://arxiv.org/abs/1706.03762"
    source_title: "Attention Is All You Need"
    publisher: "Vaswani et al., NeurIPS 2017 (arXiv:1706.03762)"
    accessed_at: "2026-08-09"
    primary_source: true
    evidence_note: "Section 3.2.2 defines multi-head attention as the concatenation of the per-head outputs projected once more by W^O; Section 3.3 gives the FFN as an inner layer of dimension d_ff followed by a projection back to d_model. Together they are the shape contract the lesson describes."
    status: needs_reverification
  - id: layer-norm-per-position
    claim: "Layer normalization computes its mean and variance over the features of a single position, independently for each position, rather than across a batch. It therefore rescales each token's own representation and moves no information between tokens: it does not create context and does not substitute for attention."
    importance: major
    source_url: "https://arxiv.org/abs/1607.06450"
    source_title: "Layer Normalization"
    publisher: "Ba, Kiros and Hinton, 2016 (arXiv:1607.06450)"
    accessed_at: "2026-08-09"
    primary_source: true
    evidence_note: "The paper defines layer normalization by computing the normalization statistics from the summed inputs to the neurons in a layer on a single training case, which is exactly the batch- and position-independence the lesson relies on. That no information crosses token boundaries follows from the statistics being per-position. The notebook omits the learnable gain and bias to isolate the mechanics and says so."
    status: needs_reverification
